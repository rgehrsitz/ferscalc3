scenarios:
  stagflation_1970s:
    name: "1970s Stagflation"
    description: "High inflation + weak equity returns following oil shocks"
    repeat: true
    years:
      - year: 1973
        label: "Oil Embargo"
        tsp_returns:
          C: "-0.147"
          S: "-0.305"
          I: "-0.178"
          F: "0.080"
          G: "0.050"
        inflation: "0.061"
        cola: "0.050"
        fehb: "0.090"
      - year: 1974
        label: "Deep recession"
        tsp_returns:
          C: "-0.264"
          S: "-0.195"
          I: "-0.232"
          F: "0.030"
          G: "0.055"
        inflation: "0.110"
        cola: "0.080"
        fehb: "0.110"
      - year: 1975
        label: "Stagflation persists"
        tsp_returns:
          C: "-0.004"
          S: "-0.120"
          I: "-0.080"
          F: "0.070"
          G: "0.060"
        inflation: "0.092"
        cola: "0.070"
        fehb: "0.100"
      - year: 1976
        label: "Slow recovery"
        tsp_returns:
          C: "0.239"
          S: "0.160"
          I: "0.100"
          F: "0.060"
          G: "0.055"
        inflation: "0.060"
        cola: "0.060"
        fehb: "0.080"

  volcker_shock_1980s:
